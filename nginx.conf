# LiraTek web front door — single origin.
#
# The SPA and the API share one origin, which removes two whole problems:
# CORS preflight configuration (CORS_ORIGIN becomes a formality) and the
# build-time API hostname (see runtime-config.js in the frontend Dockerfile).
#
# Dropped into /etc/nginx/conf.d/, so this file is inside the `http` context —
# the `map` below is legal here and must NOT be moved inside `server`.

# WebSocket handshakes need `Connection: upgrade`; everything else needs
# `Connection: close`. Deriving it avoids breaking plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream liratek_backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Catch-all: every tenant subdomain serves this SAME bundle. Tenant identity
    # is resolved server-side from the Host header (forwarded below), never by
    # serving different files per tenant.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Voucher/product image uploads exceed nginx's 1 MB default.
    client_max_body_size 20m;

    # Compression for the JS bundle (largest single asset).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ── SPA ──────────────────────────────────────────────────────────────────
    # The app uses HashRouter, so deep links never hit the server as paths; the
    # fallback is here for direct /asset URLs and future BrowserRouter use.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html and the runtime config must
    # never be cached or a deploy won't take effect until the browser gives up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # ── API ──────────────────────────────────────────────────────────────────
    # /api carries REST *and* the voice WebSocket (/api/voice/ws, matched in
    # backend/src/api/voice.ts on the raw upgrade event), so the upgrade headers
    # belong here too — not only on /socket.io.
    location /api/ {
        proxy_pass         http://liratek_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host is load-bearing: subdomain-based tenant resolution reads it.
        # $host (not $proxy_host) preserves what the browser actually asked for.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The voice socket idles between utterances; the default 60s would cut
        # it mid-session.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Socket.IO ────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://liratek_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── Health ───────────────────────────────────────────────────────────────
    # Public and unauthenticated by design (backend/src/api/health.ts) so an
    # uptime monitor can reach it without credentials.
    location /health {
        proxy_pass       http://liratek_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log       off;
    }
}

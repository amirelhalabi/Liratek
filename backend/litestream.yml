# Litestream — continuous replication of the web backend's SQLite file to
# object storage (Cloudflare R2).
#
# WHY THIS EXISTS: the Fly volume is encrypted and snapshotted daily, but a
# daily snapshot means a shop can lose up to a day of sales. Litestream ships
# the WAL continuously, so worst-case loss is measured in seconds. It is also
# the only copy of shop data that lives outside Fly.
#
# `VACUUM INTO` snapshots (BackupService) are the desktop mechanism and remain
# the belt to this braces — different failure modes on purpose.
#
# Every value is an environment variable, and the entrypoint refuses to start
# Litestream unless all of them are set: a half-configured backup that silently
# does nothing is worse than none, because you would believe you had one.
# Same rule as tenantDomains.ts.

dbs:
  - path: ${DATABASE_PATH}

    # `replica` (singular) is the 0.5.x form; the `replicas` array is
    # deprecated. Most tutorials online still show the old shape.
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}

      # Prefix inside the bucket. Named for the deployment rather than the
      # database, so the per-tenant split can add sibling prefixes without
      # reorganising what is already there.
      path: web/liratek

      # R2's S3-compatible endpoint: https://<account-id>.r2.cloudflarestorage.com
      endpoint: ${LITESTREAM_ENDPOINT}

      # R2 has no regions, but the S3 client requires the field. "auto" is what
      # Cloudflare documents.
      region: auto

      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

  # Per-tenant databases (`PRODUCTION_DATABASE_AND_HOSTING_PLAN.md` § 10/§ 12).
  # Harmless in `shared` mode (today's default): `TENANT_DATABASES_DIR` names
  # a directory the entrypoint creates unconditionally before Litestream ever
  # starts (`docker-entrypoint.sh`), so it always exists, and `watch: true`
  # lets Litestream start against a directory with zero matching files —
  # confirmed against the Litestream docs (litestream.io/guides/directory-watcher/,
  # 2026-09-27): "static" directory replication (no `watch`) errors on an
  # empty directory ("no SQLite databases found"), but the watcher explicitly
  # tolerates it and picks up files as they appear, with no config reload and
  # no restart. Once Phase D lands and shop files exist under this directory,
  # each is replicated to its own `tenants/<id>.db/` prefix for free — nothing
  # in the backup layer has to be told a tenant was created.
  #
  # `recursive` is deliberately left at its default (false): the tenants
  # directory's own `archive/<id>-<timestamp>.db` subdirectory (deleted-shop
  # archives, B-D4) must NOT be continuously replicated as if it were a live
  # shop database — a non-recursive scan naturally excludes it.
  - dir: ${TENANT_DATABASES_DIR}
    pattern: "*.db"
    watch: true
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: tenants
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

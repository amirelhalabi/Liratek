name: CI

on:
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared cache paths for yarn install
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_CACHE_PATHS: |
    .yarn/cache
    node_modules
    packages/*/node_modules
    frontend/node_modules
    backend/node_modules
    electron-app/node_modules

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Run ESLint
        run: yarn lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: TypeScript check
        run: yarn typecheck

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Backend typecheck
        run: yarn workspace @liratek/backend typecheck

      - name: Backend tests with coverage
        run: yarn workspace @liratek/backend test:coverage

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Frontend typecheck
        run: yarn workspace @liratek/frontend typecheck

      - name: Frontend tests with coverage
        run: yarn workspace @liratek/frontend test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/frontend/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # Launches the real Electron app (IPC + SQLite) via Playwright's _electron.
  # The Vite dev server is started automatically by playwright.electron.config.ts.
  e2e-tests:
    name: E2E Tests (Electron)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install virtual display + allow Electron sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces, which
          # Electron's sandbox needs; relax it for this job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Ensure better-sqlite3 is built for Electron
        run: yarn rebuild:native

      - name: Build core + electron-app
        run: |
          yarn workspace @liratek/core build
          yarn workspace @liratek/electron-app build

      - name: Run Electron E2E tests
        run: xvfb-run --auto-servernum -- yarn workspace @liratek/frontend test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Build
        run: yarn build

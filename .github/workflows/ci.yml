name: CI

on:
  pull_request:
    branches: [main, dev, develop]
  push:
    branches: [main]

# github.ref differs between the two trigger types (pull_request uses the
# synthetic refs/pull/<n>/merge ref, push uses refs/heads/main), so a push to
# main and a PR targeting main never land in the same concurrency group and
# cannot cancel each other. Verified, not changed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared cache paths for yarn install
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_CACHE_PATHS: |
    .yarn/cache
    node_modules
    packages/*/node_modules
    frontend/node_modules
    backend/node_modules
    electron-app/node_modules

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Run ESLint
        run: yarn lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: TypeScript check
        run: yarn typecheck

      - name: Tenant-scoping check (every tenant-table SQL carries tenant_id)
        run: yarn check:tenant-scoping

      - name: Bind-arity check (prepared statements' ? count == bound args)
        run: yarn check:bind-arity

      # check:schema-equivalence executes real migrations against a real
      # SQLite DB (it can't work off source text alone), so it needs
      # packages/core actually built. The "TypeScript check" step above
      # already rebuilds it as a side effect (core's `typecheck` script IS
      # `tsc -p tsconfig.json`, identical to `build`), but this step is
      # explicit rather than relying on that staying true.
      - name: Build core (schema-equivalence check needs compiled migrations)
        run: yarn build:core

      # Same reasoning as backend-tests/core-tests below: the root
      # `postinstall` builds better-sqlite3 for the ELECTRON ABI, but this
      # check opens a REAL in-memory database via better-sqlite3 under plain
      # Node, so without this it dies with a NODE_MODULE_VERSION mismatch.
      - name: Ensure better-sqlite3 is built for Node (not Electron)
        run: yarn rebuild:node

      - name: Schema equivalence check (create_db.sql <-> migrations/index.ts drift, incl. seed contents)
        run: yarn check:schema-equivalence

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Backend typecheck
        run: yarn workspace @liratek/backend typecheck

      # The root `postinstall` runs `rebuild:native`, which builds
      # better-sqlite3 for the ELECTRON ABI (125) — and node_modules is in
      # CI_CACHE_PATHS, so every job restores that binary. Backend jest runs
      # under plain Node (ABI 115 on Node 20), so the 2 suites that open a REAL
      # database (wp2_auth_tenant.api, and its sibling) died with
      # "compiled against NODE_MODULE_VERSION 125 … requires 115" while the
      # other 34 suites passed because they mock the DB.
      #
      # The root `test` script already guards this (`npm run rebuild:node &&
      # …`) and the E2E job does the mirror-image (`yarn rebuild:native`); this
      # job did neither, so it invoked the workspace test directly and inherited
      # the Electron binary.
      - name: Ensure better-sqlite3 is built for Node (not Electron)
        run: yarn rebuild:node

      - name: Backend tests with coverage
        run: yarn workspace @liratek/backend test:coverage

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false

  # LIRA-151: packages/core's jest suite (the money layer — rules 13/14/17/20
  # guards, tenant scoping, profit recognition) never ran in CI before this
  # job; `yarn test` runs it locally, but ci.yml had no job for it, so it
  # never gated a PR.
  core-tests:
    name: Core Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # Same reasoning as backend-tests above: the root `postinstall` builds
      # better-sqlite3 for the ELECTRON ABI, but core's jest suite runs under
      # plain Node — several suites open a real in-memory/on-disk database
      # via better-sqlite3, so without this they'd die with a
      # NODE_MODULE_VERSION mismatch.
      - name: Ensure better-sqlite3 is built for Node (not Electron)
        run: yarn rebuild:node

      # LIRA-123 lesson (scripts/run-e2e.mjs): a step that runs nothing and
      # exits 0 is indistinguishable from a pass, so this fails the build if
      # the reported suite/test counts fall below a floor even when jest's
      # own exit code is 0.
      #
      # Floor: current counts are 263 suites / 2781 tests (verified locally
      # 2026-09-04, `yarn workspace @liratek/core test`). The floors below
      # sit at roughly half of that — the same "comfortably below normal
      # churn, nowhere near the 0 that LIRA-123 silently reported as a pass"
      # margin scripts/run-e2e.mjs documents for its own DEFAULT_MIN — so
      # adding or removing a handful of suites/tests never trips this.
      - name: Core tests with suite-count floor
        run: |
          MIN_SUITES=130
          MIN_TESTS=1300

          set +e
          yarn workspace @liratek/core test > core-test-output.log 2>&1
          test_exit=$?
          set -e
          cat core-test-output.log

          suites_total=$(grep -E "^Test Suites:" core-test-output.log | grep -oE "[0-9]+ total" | grep -oE "[0-9]+" || true)
          tests_total=$(grep -E "^Tests:" core-test-output.log | grep -oE "[0-9]+ total" | grep -oE "[0-9]+" || true)

          echo "[core-tests] exit=$test_exit suites_total=${suites_total:-<none>} tests_total=${tests_total:-<none>}"

          if [ "$test_exit" -ne 0 ]; then
            echo "[core-tests] jest exited $test_exit — real test failure(s), see output above."
            exit "$test_exit"
          fi

          if [ -z "$suites_total" ] || [ -z "$tests_total" ]; then
            echo "[core-tests] FLOOR CHECK FAILED — no 'Test Suites:'/'Tests:' summary line found even though jest exited 0. Treating this as the LIRA-123 failure mode (a green exit code without the suite actually running)."
            exit 1
          fi

          if [ "$suites_total" -lt "$MIN_SUITES" ] || [ "$tests_total" -lt "$MIN_TESTS" ]; then
            echo "[core-tests] FLOOR CHECK FAILED — reported $suites_total suite(s)/$tests_total test(s), below the floor of $MIN_SUITES suites / $MIN_TESTS tests."
            exit 1
          fi

          echo "[core-tests] floor check passed — $suites_total suite(s), $tests_total test(s), floor $MIN_SUITES/$MIN_TESTS."

  # electron-app/handlers/__tests__/ was orphaned from every runner until
  # 2026-09-13 (jest.config.cjs's `roots` only listed `schemas`) — 15 of its
  # 31 suites had rotted unnoticed in that time. They were repaired and wired
  # into `yarn workspace @liratek/electron-app test`; this job is what makes
  # that gate a PR instead of only running on someone's machine.
  #
  # No `rebuild:node` step here (unlike backend-tests/core-tests above):
  # every suite under handlers/__tests__/ mocks `@liratek/core` and/or
  # `../../db` wholesale (verified by reading each suite's `jest.mock(...)`
  # calls) — none construct a real better-sqlite3 database, so the ABI the
  # root `postinstall` built (Electron, not Node) never gets touched.
  electron-handler-tests:
    name: Electron Handler Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # LIRA-123 lesson (scripts/run-e2e.mjs), same as the "Core tests with
      # suite-count floor" step below: a step that runs nothing and exits 0
      # is indistinguishable from a pass — this is the specific defence
      # against this directory rotting back into silence unnoticed.
      #
      # Floor: current counts are 30 suites / 155 tests — 29 handler suites
      # under handlers/__tests__/ plus the pre-existing
      # schemas/__tests__/FinancialServiceSchema.feePayments.test.ts, which
      # this same config also runs (verified locally 2026-09-13 via
      # `yarn workspace @liratek/electron-app test`, with
      # updaterHandlers.test.ts / updaterHandlers_registration.test.ts
      # excluded via jest.config.cjs's testPathIgnorePatterns — see that
      # file for why). Floor set below today's counts but high enough to
      # catch a collapse.
      - name: Electron handler tests with suite-count floor
        run: |
          MIN_SUITES=25
          MIN_TESTS=120

          set +e
          yarn workspace @liratek/electron-app test > electron-test-output.log 2>&1
          test_exit=$?
          set -e
          cat electron-test-output.log

          suites_total=$(grep -E "^Test Suites:" electron-test-output.log | grep -oE "[0-9]+ total" | grep -oE "[0-9]+" || true)
          tests_total=$(grep -E "^Tests:" electron-test-output.log | grep -oE "[0-9]+ total" | grep -oE "[0-9]+" || true)

          echo "[electron-handler-tests] exit=$test_exit suites_total=${suites_total:-<none>} tests_total=${tests_total:-<none>}"

          if [ "$test_exit" -ne 0 ]; then
            echo "[electron-handler-tests] jest exited $test_exit — real test failure(s), see output above."
            exit "$test_exit"
          fi

          if [ -z "$suites_total" ] || [ -z "$tests_total" ]; then
            echo "[electron-handler-tests] FLOOR CHECK FAILED — no 'Test Suites:'/'Tests:' summary line found even though jest exited 0. Treating this as the LIRA-123 failure mode (a green exit code without the suite actually running)."
            exit 1
          fi

          if [ "$suites_total" -lt "$MIN_SUITES" ] || [ "$tests_total" -lt "$MIN_TESTS" ]; then
            echo "[electron-handler-tests] FLOOR CHECK FAILED — reported $suites_total suite(s)/$tests_total test(s), below the floor of $MIN_SUITES suites / $MIN_TESTS tests."
            exit 1
          fi

          echo "[electron-handler-tests] floor check passed — $suites_total suite(s), $tests_total test(s), floor $MIN_SUITES/$MIN_TESTS."

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Frontend typecheck
        run: yarn workspace @liratek/frontend typecheck

      - name: Frontend tests with coverage
        run: yarn workspace @liratek/frontend test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/frontend/lcov.info
          flags: frontend
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        backend-tests,
        core-tests,
        electron-handler-tests,
        frontend-tests,
      ]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_CACHE_PATHS }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Build
        run: yarn build
